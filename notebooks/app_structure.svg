<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="Source Sans Pro, Segoe UI, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c7a8a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a1e"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="600" fill="#1d2a33">App structure, part 4</text>
  <text x="24" y="55" font-size="13" fill="#5c7a8a">Sketched before any code was moved. Grouping is by what the page is for, not by where the data comes from.</text>

  <!-- ===== Sources ===== -->
  <text x="24" y="98" font-size="12" font-weight="600" fill="#5c7a8a" letter-spacing="1.5">SOURCES</text>
  <g font-size="12.5" fill="#1d2a33">
    <rect x="24" y="110" width="152" height="40" rx="6" fill="#f0f5f8" stroke="#d9e3ea"/>
    <text x="36" y="127">NVE Magasinstatistikk</text><text x="36" y="143" font-size="11" fill="#5c7a8a">weekly, REST</text>

    <rect x="24" y="160" width="152" height="40" rx="6" fill="#f0f5f8" stroke="#d9e3ea"/>
    <text x="36" y="177">ENTSO-E → MongoDB</text><text x="36" y="193" font-size="11" fill="#5c7a8a">hourly, stored</text>

    <rect x="24" y="210" width="152" height="40" rx="6" fill="#f0f5f8" stroke="#d9e3ea"/>
    <text x="36" y="227">Open-Meteo ERA5</text><text x="36" y="243" font-size="11" fill="#5c7a8a">hourly, 4 variables</text>

    <rect x="24" y="260" width="152" height="40" rx="6" fill="#fdf3e6" stroke="#e08a1e"/>
    <text x="36" y="277">Norges Bank</text><text x="36" y="293" font-size="11" fill="#b4471f">new in part 4</text>

    <rect x="24" y="310" width="152" height="40" rx="6" fill="#f0f5f8" stroke="#d9e3ea"/>
    <text x="36" y="327">NVE Atlas shapefiles</text><text x="36" y="343" font-size="11" fill="#5c7a8a">→ GeoJSON</text>
  </g>

  <!-- ===== modules ===== -->
  <text x="222" y="98" font-size="12" font-weight="600" fill="#5c7a8a" letter-spacing="1.5">MODULES</text>
  <rect x="222" y="110" width="150" height="240" rx="8" fill="#ffffff" stroke="#14425f" stroke-width="1.4"/>
  <g font-size="12" fill="#14425f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="236" y="132">nve.py</text>
    <text x="236" y="154">storage.py</text>
    <text x="236" y="176">weather.py</text>
    <text x="236" y="198" fill="#b4471f">currency.py</text>
    <text x="236" y="220">regions.py</text>
    <text x="236" y="242" fill="#b4471f">geo.py</text>
    <text x="236" y="264">quality.py</text>
    <text x="236" y="286" fill="#b4471f">forecast.py</text>
    <text x="236" y="308" fill="#b4471f">theme.py</text>
  </g>
  <text x="236" y="334" font-size="10.5" fill="#5c7a8a">pure functions, no Streamlit</text>

  <!-- utils -->
  <rect x="222" y="366" width="150" height="54" rx="8" fill="#eef6f5" stroke="#2aa198"/>
  <text x="236" y="387" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#14425f">utils.py</text>
  <text x="236" y="404" font-size="10.5" fill="#5c7a8a">caching · guarded() · sidebar</text>

  <line x1="297" y1="350" x2="297" y2="364" stroke="#5c7a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="178" y1="230" x2="220" y2="230" stroke="#5c7a8a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ===== pages ===== -->
  <text x="420" y="98" font-size="12" font-weight="600" fill="#5c7a8a" letter-spacing="1.5">PAGES</text>

  <!-- Start -->
  <rect x="420" y="110" width="250" height="110" rx="8" fill="#ffffff" stroke="#14425f" stroke-width="2"/>
  <rect x="420" y="110" width="250" height="24" rx="8" fill="#14425f"/>
  <text x="432" y="127" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1">START</text>
  <text x="434" y="156" font-size="13.5" fill="#1d2a33">Home</text>
  <text x="434" y="174" font-size="10.5" fill="#5c7a8a">headline numbers, three ways in</text>
  <text x="434" y="196" font-size="13.5" font-weight="600" fill="#1d2a33">Map</text>
  <text x="434" y="212" font-size="10.5" fill="#5c7a8a">click an area → selection for every page</text>

  <!-- Data -->
  <rect x="420" y="236" width="250" height="140" rx="8" fill="#ffffff" stroke="#2aa198" stroke-width="2"/>
  <rect x="420" y="236" width="250" height="24" rx="8" fill="#2aa198"/>
  <text x="432" y="253" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1">DATA</text>
  <g font-size="13" fill="#1d2a33">
    <text x="434" y="282">Reservoirs</text>
    <text x="434" y="305">Power flow</text>
    <text x="434" y="328">Weather</text>
    <text x="434" y="351" fill="#b4471f">Currency</text>
  </g>
  <text x="434" y="368" font-size="10.5" fill="#5c7a8a">one page per source, as it arrives</text>

  <!-- Analysis -->
  <rect x="690" y="236" width="250" height="140" rx="8" fill="#ffffff" stroke="#e08a1e" stroke-width="2"/>
  <rect x="690" y="236" width="250" height="24" rx="8" fill="#e08a1e"/>
  <text x="702" y="253" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1">ANALYSIS</text>
  <g font-size="13" fill="#1d2a33">
    <text x="704" y="282">Outliers</text>
    <text x="704" y="305">Decomposition</text>
    <text x="704" y="328" fill="#b4471f">Correlation</text>
    <text x="704" y="351" fill="#b4471f">Forecast</text>
  </g>
  <text x="704" y="368" font-size="10.5" fill="#5c7a8a">what we do to it</text>

  <!-- Info -->
  <rect x="690" y="110" width="250" height="110" rx="8" fill="#ffffff" stroke="#5c7a8a" stroke-width="2"/>
  <rect x="690" y="110" width="250" height="24" rx="8" fill="#5c7a8a"/>
  <text x="702" y="127" font-size="12" font-weight="600" fill="#ffffff" letter-spacing="1">INFO</text>
  <text x="704" y="156" font-size="13.5" fill="#1d2a33">About</text>
  <text x="704" y="174" font-size="10.5" fill="#5c7a8a">sources, pipeline, known limits</text>
  <text x="704" y="200" font-size="10.5" fill="#5c7a8a">Dropped: the LineChartColumn page.</text>
  <text x="704" y="214" font-size="10.5" fill="#5c7a8a">It is a tab on Reservoirs instead.</text>

  <!-- arrows -->
  <line x1="374" y1="393" x2="418" y2="330" stroke="#5c7a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="374" y1="393" x2="688" y2="330" stroke="#5c7a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="672" y1="300" x2="688" y2="300" stroke="#2aa198" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- session state -->
  <rect x="420" y="408" width="520" height="56" rx="8" fill="#fdf3e6" stroke="#e08a1e" stroke-dasharray="5 4"/>
  <text x="434" y="430" font-size="12.5" font-weight="600" fill="#b4471f">st.session_state carries the selection sideways</text>
  <text x="434" y="450" font-size="11" fill="#5c7a8a">chosen_area_type · chosen_area_number · weather_daily · weather_request</text>
  <line x1="545" y1="222" x2="545" y2="406" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowAmber)"/>
  <line x1="815" y1="378" x2="815" y2="406" stroke="#e08a1e" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrowAmber)"/>

  <!-- notes -->
  <text x="24" y="500" font-size="12" font-weight="600" fill="#5c7a8a" letter-spacing="1.5">DECISIONS THIS SKETCH SETTLED</text>
  <g font-size="12" fill="#1d2a33">
    <text x="24" y="524">1.  Group by task, not by source. &quot;Where did this come from&quot; is a question for the About page; &quot;what am I trying to find out&quot; is the question a menu should answer.</text>
    <text x="24" y="546">2.  The Map is the selector, so it sits in Start rather than in Analysis. Everything downstream reads the area it sets.</text>
    <text x="24" y="568">3.  Four data pages and four analysis pages, which is the point at which grouping starts paying for itself. Below about six pages a flat list is better.</text>
    <text x="24" y="590">4.  LineChartColumn does not deserve a page. It is one view of the reservoir table, so it became a tab on Reservoirs.</text>
  </g>
</svg>
